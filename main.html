<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CF2KGAMER TAMBAYAN PH</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

html,body{
width:100%;
height:100%;
background:#050A14;
color:white;
overflow:auto;
}

body::-webkit-scrollbar{display:none;}

.main{
min-height:100vh;
width:100%;
padding:25px;
display:flex;
flex-direction:column;
align-items:center;
}

.logo{
font-size:34px;
font-weight:900;
text-align:center;
background:linear-gradient(to bottom,#1DA1FF,#3B82F6,#60A5FA);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
margin-top:6px;
font-size:13px;
color:#7AB6FF;
margin-bottom:25px;
}

.cards-scroll{
width:100%;
overflow-x:auto;
overflow-y:hidden;
padding-bottom:10px;
}

.cards-scroll::-webkit-scrollbar{display:none;}

.cards-row{
display:flex;
gap:15px;
width:max-content;
padding:10px;
}

.card{
width:240px;
min-height:180px;
padding:20px;
border-radius:20px;
background:linear-gradient(to bottom,#0B2A5B,#050A14);
border:2px solid #3B82F6;
display:flex;
flex-direction:column;
flex-shrink:0;
cursor:pointer;
transition:0.2s;
}

.card:hover{
border:3px solid white;
transform:scale(1.05);
}

.card img{
width:55px;
height:55px;
align-self:flex-end;
}

.spacer{height:15px;}

.card-title{font-size:18px;font-weight:700;}
.card-sub{margin-top:5px;font-size:11px;color:#7AB6FF;}

.enter-btn{
padding:9px 22px;
border-radius:100px;
background:#1D4ED8;
width:max-content;
margin-top:10px;
font-size:11px;
}

.admin-card{
margin-top:20px;
width:240px;
}

.dialog{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.dialog-box{
width:90%;
max-width:350px;
padding:25px;
border-radius:20px;
background:#050A14;
border:2px solid #3B82F6;
display:flex;
flex-direction:column;
align-items:center;
}

.social-btn{
width:100%;
padding:12px;
border-radius:100px;
text-align:center;
color:white;
margin-top:10px;
text-decoration:none;
font-size:12px;
}

.youtube{background:#1D4ED8;}
.facebook{background:#2563EB;}

.close-btn{
margin-top:15px;
padding:10px 25px;
border:none;
border-radius:100px;
background:#111827;
color:white;
cursor:pointer;
font-size:12px;
}

</style>
</head>

<body>

<div class="main">

<div class="logo">CF2KGAMER</div>
<div class="sub">TAMBAYAN PH</div>

<div class="cards-scroll">
<div class="cards-row">

<div class="card" onclick="loadRaw('home.html')">
<img src="https://i.postimg.cc/CK0hywsJ/ic-tv.png">
<div class="spacer"></div>
<div class="card-title">MOVIES</div>
<div class="card-sub">Series & Films</div>
<div class="enter-btn">ENTER</div>
</div>

<div class="card" onclick="loadRaw('live.html')">
<img src="https://i.postimg.cc/2SQY7PNW/ic-cf2k.png">
<div class="spacer"></div>
<div class="card-title">LIVE TV</div>
<div class="card-sub">Premium Channels</div>
<div class="enter-btn">ENTER</div>
</div>

</div>
</div>

<div class="card admin-card" onclick="showAdmin()">
<img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
<div class="spacer"></div>
<div class="card-title">ADMIN</div>
<div class="card-sub">Developer & Owner</div>
<div class="enter-btn">ENTER</div>
</div>

</div>

<div class="dialog" id="dialog">
<div class="dialog-box">

<div class="card-title">CF2KGAMER OFFICIAL</div>

<a class="social-btn youtube" href="https://www.youtube.com/@Cf2kGamerOfficial" target="_blank">SUBSCRIBE</a>
<a class="social-btn facebook" href="https://www.facebook.com/profile.php?id=61567068784289" target="_blank">FOLLOW</a>

<button class="close-btn" onclick="hideAdmin()">CLOSE</button>

</div>
</div>

<script>

const RAW_BASE =
"https://raw.githubusercontent.com/Cf2kGamerOfficial13/Cf2kGamer-Tambyan-Ph/refs/heads/main/";

async function loadRaw(file){
try{
const res = await fetch(RAW_BASE + file);
const html = await res.text();

document.open();
document.write(html);
document.close();
}catch(e){
alert("Failed to load page");
}
}

function showAdmin(){
document.getElementById('dialog').style.display='flex';
}

function hideAdmin(){
document.getElementById('dialog').style.display='none';
}

document.body.addEventListener('click',()=>{
document.documentElement.requestFullscreen?.();
},{once:true});

</script>

</body>
</html>
