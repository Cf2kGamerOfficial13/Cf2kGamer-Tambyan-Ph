<script>
(function () {

const host = location.hostname;

window.open = function () { return null; };

const allow = (url) => {
try{
const u = new URL(url, location.href);
return u.hostname === host;
}catch{
return false;
}
};

const origAssign = window.location.assign.bind(window.location);
const origReplace = window.location.replace.bind(window.location);

window.location.assign = function(url){
if(allow(url)) origAssign(url);
};

window.location.replace = function(url){
if(allow(url)) origReplace(url);
};

try{
if(window.top !== window.self){
window.top.location = window.self.location;
}
}catch(e){}

setInterval(() => {

document.querySelectorAll("iframe").forEach(f => {
if(!f.src.includes(host)) f.remove();
});

document.querySelectorAll("script").forEach(s => {
if(
s.src &&
!s.src.includes(host) &&
!s.src.includes("tmdb") &&
!s.src.includes("cdn.jsdelivr")
){
s.remove();
}
});

},1500);

document.addEventListener("click", function(e){

const a = e.target.closest("a");

if(!a) return;

if(!a.href.includes(host)){
e.preventDefault();
e.stopPropagation();
return false;
}

},true);

})();
</script>

<script>

const apiKey =
"16902847bed95ac4ac7130b3f811f009";

const urlParams =
new URLSearchParams(
window.location.search
);

const type =
urlParams.get("type") || "movie";

let currentPage = 1;
let isSearching = false;
let isLoading = false;

function toggleMenu(){

const sideMenu =
document.getElementById(
"side-menu"
);

document.getElementById(
"menu-overlay"
).style.display =
sideMenu.classList.toggle("active")
? "block" : "none";

}

function setHighlight(){

const navItem =
document.getElementById(
"nav-" + type
);

if(navItem){
navItem.classList.add(
"active-link"
);
}

const titles = {
movie:"MOVIES",
tv:"TV SERIES",
kids:"KIDS ZONE",
ph:"PINOY PRIDE"
};

document.getElementById(
"explore-title"
).innerText =
titles[type] || "EXPLORE";

}

async function fetchExplore(
page = 1,
query = ""
){

if(isLoading) return;

isLoading = true;

document
.getElementById(
"loading"
)
.classList.remove(
"hidden"
);

let url =
query
? `https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(query)}&page=${page}`
: `https://api.themoviedb.org/3/${getCategoryPath()}&api_key=${apiKey}&page=${page}`;

try{

const response =
await fetch(url);

const data =
await response.json();

renderGrid(
data.results,
page === 1
);

}catch(error){
console.error(error);
}

finally{

document
.getElementById(
"loading"
)
.classList.add(
"hidden"
);

isLoading = false;

}

}

function getCategoryPath(){

if(type === "tv")
return "discover/tv?sort_by=popularity.desc";

if(type === "kids")
return "discover/tv?with_genres=10762&sort_by=popularity.desc";

if(type === "ph")
return "discover/movie?with_origin_country=PH&sort_by=popularity.desc";

return "discover/movie?sort_by=popularity.desc";

}

function renderGrid(
results,
isNewLoad
){

const grid =
document.getElementById(
"explore-grid"
);

if(isNewLoad)
grid.innerHTML = "";

results.forEach(item => {

if(!item.poster_path)
return;

const mediaType =
item.media_type ||
(type === "tv" || type === "kids"
? "tv" : "movie");

const card =
document.createElement(
"div"
);

card.className =
"portrait-card";

card.tabIndex = "0";

card.onclick =
() => window.location.href =
`player.html?id=${item.id}&type=${mediaType}`;

card.onkeydown = (e) => {

if(e.key === "Enter")
card.onclick();

};

card.innerHTML = `

<img src="https://image.tmdb.org/t/p/w300${item.poster_path}" loading="lazy">

<div class="portrait-overlay"></div>

<div class="absolute bottom-2 left-2 right-2 z-20">

<p class="text-[8px] font-black truncate text-zinc-100 uppercase">
${item.title || item.name}
</p>

<p class="text-[7px] text-cyan-300 font-bold">
★ ${item.vote_average ? item.vote_average.toFixed(1) : "0.0"}
</p>

</div>

`;

grid.appendChild(card);

});

}

window.onscroll = () => {

if(isSearching)
return;

if(
window.innerHeight +
window.scrollY >=
document.body.offsetHeight - 1000
){

if(!isLoading){

currentPage++;

fetchExplore(
currentPage
);

}

}

};

let searchTimer;

document
.getElementById(
"inner-search"
)
.addEventListener(
"input",
(e) => {

clearTimeout(
searchTimer
);

searchTimer =
setTimeout(() => {

const query =
e.target.value;

if(query.length > 2){

isSearching = true;

fetchExplore(
1,
query
);

}else if(
query.length === 0
){

isSearching = false;

fetchExplore(1);

}

},500);

}
);

document.addEventListener(
"keydown",
(e) => {

if(
[
"ArrowUp",
"ArrowDown",
"ArrowLeft",
"ArrowRight"
].includes(e.key)
){

setTimeout(() => {

const active =
document.activeElement;

if(
active &&
active.classList.contains(
"portrait-card"
)
){

active.scrollIntoView({
behavior:"smooth",
block:"center"
});

}

},10);

}

}
);

window.onload = () => {

setHighlight();

fetchExplore(1);

};

</script>

<script>

const tabs =
document.querySelectorAll(
'.tab-item'
);

tabs.forEach(tab => {

if(
window.location.href.includes(
tab.getAttribute('href')
)
){
tab.classList.add('active');
}

tab.addEventListener('click', () => {

tabs.forEach(t =>
t.classList.remove('active')
);

tab.classList.add('active');

});

});

</script>
