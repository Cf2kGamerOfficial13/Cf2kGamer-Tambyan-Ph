<script>

document.getElementById('search-input').addEventListener('input', async (e) => {

if(query.length < 2) return;

try{

const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(query)}`);

const data = await res.json();

resBox.innerHTML = '';

data.results.forEach(item => {

const card = document.createElement('div');

card.className = "search-card";

card.tabIndex = 0;

card.onclick = () => location.href = `player.html?id=${item.id}&type=${item.media_type}`;

card.innerHTML = `
<img src="https://image.tmdb.org/t/p/w300${item.poster_path}">
<p class="p-3 text-[10px] font-black uppercase tracking-wide truncate">
${item.title || item.name}

`;

resBox.appendChild(card);

});

}catch(e){}

});

function toggleMenu(){

const m = document.getElementById('side-menu');

m.classList.toggle('active');

document.getElementById('menu-overlay').style.display =
m.classList.contains('active') ? 'block' : 'none';

}

function toggleSearch(){

const s = document.getElementById('search-container');

s.style.display = (s.style.display === 'flex') ? 'none' : 'flex';

document.getElementById('search-input').focus();
}

function setMediaType(type){

activeType = type;

document.getElementById('type-movie').classList.toggle('active', type === 'movie');

document.getElementById('type-tv').classList.toggle('active', type === 'tv');

updateServiceRow(activeNetId, activeNetName, document.querySelector('.chip.active'));

}

async function updateServiceRow(id, name, el){

activeNetId = id;
activeNetName = name;

document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));

if(el) el.classList.add('active');

const container = document.getElementById('dynamic-service-row');

container.innerHTML = `
<div class="loading-text">

</div>
`;

try{

const res = await fetch(`https://api.themoviedb.org/3/discover/${activeType}?api_key=${apiKey}&with_networks=${id}&sort_by=popularity.desc`);

const data = await res.json();

container.innerHTML = '';

renderRow(container, `Popular on ${name}`, data.results.slice(0,12), false, activeType, true);

}catch(e){

container.innerHTML = '';

}

}

function renderRow(target, title, items, isRanked, type, isYellow){

const section = document.createElement('section');

let cardsHTML = '';

items.forEach((item, i) => {

? `https://image.tmdb.org/t/p/w400${item.poster_path}`
: `https://image.tmdb.org/t/p/w400${item.backdrop_path}`;

`tabindex="0"
onclick="location.href='player.html?id=${item.id}&type=${type}'"
onkeydown="if(event.key==='Enter')location.href='player.html?id=${item.id}&type=${type}'"`;

cardsHTML += `
<div class="ranking-card" ${action}>

<div class="overlay-number">
${i+1}

<img src="https://image.tmdb.org/t/p/w500${item.backdrop_path}">

<div class="absolute bottom-3 left-16 right-3 z-30 truncate text-[10px] font-black uppercase tracking-wide">
${item.title || item.name}
</div>

</div>
`;

}else{

cardsHTML += `
<div class="portrait-card" ${action}>

<img src="${img}">

<div class="portrait-overlay"></div>

<div class="absolute bottom-3 left-3 right-3 z-20 truncate text-[9px] font-black uppercase tracking-wide">

s.classList.toggle('active-slide', i === heroIndex);
});

document.querySelectorAll('.hero-dot').forEach((d, i) => {
d.classList.toggle('active', i === heroIndex);
});

}

function goHero(i){

const banner = document.getElementById('hero-banner');

const slides = document.querySelectorAll('.banner-slide');

if(!slides.length) return;

if(i >= slides.length) i = 0;

if(i < 0) i = slides.length - 1;

heroIndex = i;

banner.scrollTo({
left:heroIndex * banner.offsetWidth,
behavior:'smooth'
});

updateHeroDots();

}

function startHeroAuto(){

clearInterval(heroTimer);

heroTimer = setInterval(() => {
goHero(heroIndex + 1);
}, 4000);

}

setTimeout(() => {

const slides = document.querySelectorAll('.banner-slide');

const dots = document.getElementById('hero-dots');

if(dots && !dots.innerHTML){

slides.forEach((_, i) => {

dots.innerHTML += `
<div class="hero-dot ${i === 0 ? 'active' : ''}"></div>
`;

});

}

updateHeroDots();

startHeroAuto();

const banner = document.getElementById('hero-banner');

banner.addEventListener('touchstart', e => {

heroTouch = e.touches[0].clientX;

clearInterval(heroTimer);

});

banner.addEventListener('touchend', e => {

let diff = heroTouch - e.changedTouches[0].clientX;

if(diff > 50) goHero(heroIndex + 1);

if(diff < -50) goHero(heroIndex - 1);

startHeroAuto();

});

banner.addEventListener('scroll', () => {

clearTimeout(window.heroSnap);

window.heroSnap = setTimeout(() => {

heroIndex = Math.round(
banner.scrollLeft / banner.offsetWidth
);

updateHeroDots();

}, 80);

});

window.addEventListener('resize', () => {
goHero(heroIndex);
});

}, 1800);

});

document.addEventListener('keydown', (e) => {

setTimeout(() => {

const a = document.activeElement;

if(
a &&
(
a.classList.contains('portrait-card') ||
a.classList.contains('ranking-card') ||
a.tagName === 'BUTTON'
)
){

a.scrollIntoView({
behavior:'smooth',
inline:'center',
block:'nearest'
});

}

}, 50);

});
