<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />

<title>CF2KGAMER TAMBAYAN PH</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
color:white;
background:radial-gradient(circle at top,#1b7dff 0%,#071a33 45%,#020610 100%);
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(0,180,255,.18),transparent 40%),
radial-gradient(circle at 80% 10%,rgba(80,160,255,.15),transparent 35%),
radial-gradient(circle at bottom,rgba(0,120,255,.12),transparent 45%);
pointer-events:none;
z-index:-1;
}

.topbar{
backdrop-filter:blur(18px);
background:rgba(10,25,50,.65);
border-bottom:1px solid rgba(120,220,255,.15);
}

.video-container{
position:relative;
width:100%;
aspect-ratio:16/9;
background:black;
border-bottom:1px solid rgba(120,220,255,.15);
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

iframe{
width:100%;
height:100%;
border:none;
}

.panel{
background:linear-gradient(180deg,rgba(20,60,120,.35),rgba(5,12,25,.85));
backdrop-filter:blur(18px);
border:1px solid rgba(120,220,255,.12);
border-radius:22px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.section-title{
font-family:'Orbitron',sans-serif;
letter-spacing:3px;
color:#7fe7ff;
font-size:10px;
}

.server-btn{
background:rgba(20,40,80,.5);
border:1px solid rgba(120,220,255,.15);
border-radius:14px;
font-family:'Orbitron',sans-serif;
font-size:11px;
font-weight:800;
color:#aee9ff;
transition:.2s;
}

.server-btn.active{
background:linear-gradient(135deg,#1d7fff,#4fe4ff);
color:white;
box-shadow:0 0 20px rgba(0,180,255,.3);
}

.ep-btn{
background:rgba(15,35,70,.45);
border:1px solid rgba(120,220,255,.12);
border-radius:12px;
font-size:10px;
font-weight:800;
color:#9fe9ff;
font-family:'Orbitron',sans-serif;
}

.ep-btn.active{
background:linear-gradient(135deg,#1f82ff,#55e6ff);
color:white;
}

.cast-img{
width:62px;
height:62px;
border-radius:50%;
object-fit:cover;
border:2px solid #6fdcff;
box-shadow:0 0 18px rgba(0,180,255,.25);
}

#title{
font-family:'Orbitron',sans-serif;
background:linear-gradient(90deg,#fff,#7fe7ff,#3ab6ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

select{
background:rgba(10,30,60,.8)!important;
color:#8fefff!important;
border:1px solid rgba(120,220,255,.2)!important;
border-radius:12px;
}

.no-scrollbar::-webkit-scrollbar{
display:none;
}

</style>

</head>

<body class="pb-10">

<div class="topbar flex items-center gap-4 p-4 sticky top-0 z-50">

<button
onclick="window.location.href='index.html'"
class="text-cyan-300 font-bold text-xs font-['Orbitron']">

← BACK

</button>

<button
onclick="location.reload()"
class="text-cyan-200 text-[10px] font-bold uppercase">

Reload

</button>

</div>

<div id="player-area" class="video-container">

<iframe
id="player-frame"
allowfullscreen
referrerpolicy="no-referrer"
allow="autoplay; fullscreen">
</iframe>

</div>

<main class="p-5">

<div class="panel p-5 mb-5">

<h2 id="title" class="text-xl font-black uppercase">
Loading...
</h2>

<div class="flex gap-3 mt-2">

<span id="rating" class="text-cyan-300 text-xs font-bold">
★ --
</span>

<span id="type-tag" class="text-[9px] px-2 py-1 rounded bg-cyan-900/40">
Movie
</span>

</div>

</div>

<div class="panel p-5 mb-5">

<p class="section-title mb-3">
SELECT SERVER
</p>

<div class="grid grid-cols-2 gap-3">

<button
onclick="updateServer('vidfastpro')"
id="btn-vidfastpro"
class="server-btn py-3 active">

VIDFASTPRO

</button>

<button
onclick="updateServer('vidlink')"
id="btn-vidlink"
class="server-btn py-3">

VIDLINK

</button>

</div>

</div>

<div id="series-controls" class="hidden panel p-5 mb-5">

<p class="section-title mb-3">
EPISODES
</p>

<select
id="seasonSelect"
onchange="loadEpisodes(this.value)"
class="w-full p-3 mb-3">
</select>

<div
id="episode-list"
class="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto no-scrollbar">
</div>

</div>

<div class="panel p-5 mb-5">

<p class="section-title mb-3">
OVERVIEW
</p>

<p id="overview" class="text-sm text-gray-300"></p>

</div>

<div class="panel p-5">

<p class="section-title mb-3">
TOP CAST
</p>

<div
id="cast-list"
class="flex gap-4 overflow-x-auto no-scrollbar">
</div>

</div>

</main>

<script>

// BLOCK POPUPS + ADS

(function () {

const removeAds = () => {

document.querySelectorAll(`
iframe:not(#player-frame),
.ads,
.ad,
.popup,
.banner,
[class*="ad-"],
[id*="ad-"],
[class*="popup"],
[id*="popup"]
`).forEach(el => el.remove());

};

setInterval(removeAds, 500);

// block popups

window.open = () => null;

// block redirect links

document.addEventListener('click', e => {

const a = e.target.closest('a');

if (a && a.href && !a.href.includes(location.hostname)) {

e.preventDefault();
e.stopPropagation();

}

}, true);

})();

const apiKey = "024c5dee9af18585c60e92fa104e3f8c";

const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get("id");

const type = urlParams.get("type") || "movie";

let currentSeason = 1;
let currentEpisode = 1;
let currentServer = "vidfastpro";

function updateServer(serverKey){

currentServer = serverKey;

const iframe = document.getElementById("player-frame");

const mediaType = type === "anime"
? "tv"
: type;

document
.querySelectorAll(".server-btn")
.forEach(btn => btn.classList.remove("active"));

document
.getElementById("btn-" + serverKey)
.classList.add("active");

const servers = {

vidfastpro:
`https://vidfast.pro/${mediaType}/${id}${
mediaType === "tv"
? `/${currentSeason}/${currentEpisode}`
: ""
}?autoplay=1`,

vidlink:
`https://vidlink.pro/${mediaType}/${id}${
mediaType === "tv"
? `/${currentSeason}/${currentEpisode}`
: ""
}?autoplay=1&ads=0`

};

iframe.src = servers[serverKey];

iframe.onload = () => {

try {

iframe.contentWindow.postMessage(
'{"event":"command","func":"unMute","args":""}',
"*"
);

iframe.contentWindow.postMessage(
'{"method":"unmute"}',
"*"
);

} catch(err){}

};

}

async function init(){

if(!id) return;

const mediaType = type === "anime"
? "tv"
: type;

const res = await fetch(
`https://api.themoviedb.org/3/${mediaType}/${id}?api_key=${apiKey}`
);

const data = await res.json();

document.getElementById("title").textContent =
data.title || data.name;

document.getElementById("overview").textContent =
data.overview || "No overview available.";

document.getElementById("rating").textContent =
"★ " + (
data.vote_average
? data.vote_average.toFixed(1)
: "0.0"
);

document.getElementById("type-tag").textContent =
type.toUpperCase();

const castRes = await fetch(
`https://api.themoviedb.org/3/${mediaType}/${id}/credits?api_key=${apiKey}`
);

const castData = await castRes.json();

document.getElementById("cast-list").innerHTML =
castData.cast.slice(0,10).map(person => `

<div class="text-center w-16 flex-shrink-0">

<img
class="cast-img"
src="${
person.profile_path
? "https://image.tmdb.org/t/p/w185" + person.profile_path
: "https://via.placeholder.com/60"
}">

<p class="text-[8px] text-cyan-200 truncate">
${person.name}
</p>

</div>

`).join("");

if(mediaType === "tv"){

document
.getElementById("series-controls")
.classList.remove("hidden");

const seasonSelect =
document.getElementById("seasonSelect");

seasonSelect.innerHTML =
data.seasons
.filter(season => season.season_number > 0)
.map(season => `

<option value="${season.season_number}">
Season ${season.season_number}
</option>

`).join("");

loadEpisodes(1);

}else{

updateServer("vidfastpro");

}

}

async function loadEpisodes(season){

currentSeason = season;

const res = await fetch(
`https://api.themoviedb.org/3/tv/${id}/season/${season}?api_key=${apiKey}`
);

const data = await res.json();

document.getElementById("episode-list").innerHTML =
data.episodes.map(ep => `

<button
onclick="setEpisode(${ep.episode_number})"
class="ep-btn py-2">

EP ${ep.episode_number}

</button>

`).join("");

setEpisode(1);

}

function setEpisode(ep){

currentEpisode = ep;

updateServer(currentServer);

}

init();

</script>

</body>
</html>
